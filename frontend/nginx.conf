server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    gzip_static on;
    gzip on;
    gzip_types application/javascript application/json application/wasm text/css font/ttf font/otf;

    # API Symfony (service `api` du compose) en même origine : pas de CORS.
    location /keepmydiet/api/ {
        proxy_pass http://api/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        client_max_body_size 20m;
    }

    # Les noms de fichiers Flutter ne sont pas hashés : no-cache = le navigateur
    # garde sa copie mais revalide (304 si inchangé), donc jamais de version
    # périmée après un redéploiement, sans retélécharger les ~10 Mo à chaque fois.
    location /keepmydiet/ {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /keepmydiet/index.html;
    }

    # mime.types de nginx ne connaît pas .mjs (chargeur du build wasm) :
    # sans type JS, le navigateur refuse de l'exécuter.
    location ~ ^/keepmydiet/.+\.mjs$ {
        types { }
        default_type text/javascript;
        add_header Cache-Control "no-cache";
    }
}
