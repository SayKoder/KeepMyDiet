services:
  app:
    build:
      context: ../backend
      dockerfile: Dockerfile
      args:
        PHP_VERSION: "8.4"
    restart: unless-stopped
    environment:
      APP_ENV: prod
      APP_SECRET: ${APP_SECRET}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}?serverVersion=16&charset=utf8
      JWT_SECRET_KEY: /var/www/html/config/jwt/private.pem
      JWT_PUBLIC_KEY: /var/www/html/config/jwt/public.pem
      JWT_PASSPHRASE: ${JWT_PASSPHRASE}
      MERCURE_URL: http://mercure/.well-known/mercure
      MERCURE_PUBLIC_URL: https://api.TODO-domaine.tld/.well-known/mercure
      MERCURE_JWT_SECRET: ${MERCURE_JWT_SECRET:?MERCURE_JWT_SECRET requis (openssl rand -hex 32)}
      MERCURE_JWT_ISSUER: keepmydiet
    volumes:
      - jwt_keys:/var/www/html/config/jwt
    depends_on:
      - database
      - mercure
    networks:
      - internal

  mercure:
    image: dunglas/mercure
    restart: unless-stopped
    environment:
      SERVER_NAME: ":80"
      MERCURE_PUBLISHER_JWT_KEY: ${MERCURE_JWT_SECRET}
      MERCURE_SUBSCRIBER_JWT_KEY: ${MERCURE_JWT_SECRET}
      MERCURE_TRUSTED_ISSUERS: keepmydiet
      MERCURE_EXTRA_DIRECTIVES: |
        cors_origins https://app.TODO-domaine.tld
    volumes:
      - mercure_data:/data
      - mercure_config:/config
    networks:
      - web
      - internal
    labels:
      # Routé directement par Traefik (pas via nginx : un tampon de réponse bloquerait les événements).
      # Plus spécifique que le routeur de l'API sur le même Host, donc prioritaire.
      - "traefik.enable=true"
      - "traefik.http.routers.keepmydiet-mercure.rule=Host(`api.TODO-domaine.tld`) && PathPrefix(`/.well-known/mercure`)"
      - "traefik.http.routers.keepmydiet-mercure.entrypoints=websecure"
      - "traefik.http.routers.keepmydiet-mercure.tls.certresolver=TODO-certresolver"
      - "traefik.http.services.keepmydiet-mercure.loadbalancer.server.port=80"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ../backend/public:/var/www/html/public:ro
      - ./nginx/backend.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - web
      - internal
    labels:
      # TODO (étape 18 — déploiement VPS) : brancher sur le réseau Traefik réel du VPS
      # et remplacer le Host() par le vrai domaine avant mise en prod.
      - "traefik.enable=true"
      - "traefik.http.routers.keepmydiet-api.rule=Host(`api.TODO-domaine.tld`)"
      - "traefik.http.routers.keepmydiet-api.entrypoints=websecure"
      - "traefik.http.routers.keepmydiet-api.tls.certresolver=TODO-certresolver"
      - "traefik.http.services.keepmydiet-api.loadbalancer.server.port=80"

  database:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - database_data:/var/lib/postgresql/data:rw
    networks:
      - internal

networks:
  web:
    # TODO (étape 18) : réseau externe déjà créé sur le VPS, partagé avec Traefik.
    external: true
  internal:

volumes:
  database_data:
  jwt_keys:
  mercure_data:
  mercure_config:
