# Preview web (dev) : app Flutter compilée en web + API Symfony, derrière le
# Traefik du serveur. Sert à tester les écrans depuis un téléphone sans build natif.
#   https://remi-faupin.me/keepmydiet/
#
# docker compose --env-file .env.web -f docker-compose.web.yml up -d --build
services:
  web:
    build:
      context: ../frontend
    restart: unless-stopped
    depends_on:
      - api
    networks:
      - proxy
      - internal
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.keepmydiet.rule=Host(`${APP_DOMAIN}`) && PathPrefix(`/keepmydiet`)"
      - "traefik.http.routers.keepmydiet.entrypoints=websecure"
      - "traefik.http.routers.keepmydiet.tls.certresolver=le"
      - "traefik.http.services.keepmydiet.loadbalancer.server.port=80"

  api:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ../backend/public:/var/www/html/public:ro
      - ./nginx/backend.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - internal

  app:
    build:
      context: ../backend
      args:
        PHP_VERSION: "8.4"
    restart: unless-stopped
    environment:
      APP_ENV: prod
      APP_SECRET: ${APP_SECRET}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}?serverVersion=16&charset=utf8
      JWT_SECRET_KEY: /var/www/html/config/jwt/private.pem
      JWT_PUBLIC_KEY: /var/www/html/config/jwt/public.pem
      JWT_PASSPHRASE: ${JWT_PASSPHRASE}
      DEFAULT_URI: https://${APP_DOMAIN}/keepmydiet
      CORS_ALLOW_ORIGIN: ^https://${APP_DOMAIN}$$
      MERCURE_URL: http://mercure/.well-known/mercure
      MERCURE_PUBLIC_URL: https://${APP_DOMAIN}/keepmydiet/.well-known/mercure
      MERCURE_JWT_SECRET: ${MERCURE_JWT_SECRET:?MERCURE_JWT_SECRET requis (openssl rand -hex 32)}
      MERCURE_JWT_ISSUER: keepmydiet
    volumes:
      - jwt_keys:/var/www/html/config/jwt
    depends_on:
      - database
      - mercure
    networks:
      - internal

  mercure:
    image: dunglas/mercure
    restart: unless-stopped
    environment:
      SERVER_NAME: ":80"
      MERCURE_PUBLISHER_JWT_KEY: ${MERCURE_JWT_SECRET}
      MERCURE_SUBSCRIBER_JWT_KEY: ${MERCURE_JWT_SECRET}
      MERCURE_TRUSTED_ISSUERS: keepmydiet
      MERCURE_EXTRA_DIRECTIVES: |
        cors_origins https://${APP_DOMAIN}
    volumes:
      - mercure_data:/data
      - mercure_config:/config
    networks:
      - proxy
      - internal
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.keepmydiet-mercure.rule=Host(`${APP_DOMAIN}`) && PathPrefix(`/keepmydiet/.well-known/mercure`)"
      - "traefik.http.routers.keepmydiet-mercure.priority=100"
      - "traefik.http.routers.keepmydiet-mercure.entrypoints=websecure"
      - "traefik.http.routers.keepmydiet-mercure.tls.certresolver=le"
      - "traefik.http.routers.keepmydiet-mercure.middlewares=keepmydiet-mercure-strip"
      - "traefik.http.middlewares.keepmydiet-mercure-strip.stripprefix.prefixes=/keepmydiet"
      - "traefik.http.services.keepmydiet-mercure.loadbalancer.server.port=80"

  database:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - database_data:/var/lib/postgresql/data:rw
    networks:
      - internal

networks:
  proxy:
    external: true
  internal:

volumes:
  database_data:
  jwt_keys:
  mercure_data:
  mercure_config:
