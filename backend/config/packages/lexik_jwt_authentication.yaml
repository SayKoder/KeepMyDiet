lexik_jwt_authentication:
    secret_key: '%env(resolve:JWT_SECRET_KEY)%'
    public_key: '%env(resolve:JWT_PUBLIC_KEY)%'
    pass_phrase: '%env(JWT_PASSPHRASE)%'
    # 24h (défaut du bundle : 3600 = 1h) — évite de forcer une reconnexion
    # trop fréquente sur une appli mobile qu'on garde ouverte toute la journée.
    token_ttl: 86400
